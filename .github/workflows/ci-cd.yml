name: CI/CD
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
      - run: flutter build web --base-href /Software_pm/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
      - uses: actions/deploy-pages@v5
